<!DOCTYPE html>
<html lang="en">
<head>
  <!-- kids_core/tool/pwa.py tarafından üretildi. -->
  <base href="/oyunlar-pwa/unicornsalon/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Welcome to Rainbow Valley! Become a magical unicorn stylist and care for more than 60 adorable unicorns across 12 enchanted lands.">
  <meta name="theme-color" content="#8A5CF6">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Unicorn Salon">
  <meta name="referrer" content="no-referrer">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Unicorn Salon</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8A5CF6; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #kc-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 28px; background: radial-gradient(circle at 30% 20%, #B295F9 0%, #8A5CF6 55%, #FF5FA2 130%);
      transition: opacity .45s ease; z-index: 10; }
    #kc-splash.kc-gone { opacity: 0; pointer-events: none; }
    #kc-splash img { width: min(34vmin, 220px); height: min(34vmin, 220px); border-radius: 22%;
      box-shadow: 0 18px 50px rgba(0,0,0,.28), 0 0 0 6px rgba(255,255,255,.55);
      animation: kc-bob 2.4s ease-in-out infinite; }
    #kc-splash .kc-bar { width: min(46vmin, 300px); height: 14px; border-radius: 99px; background: rgba(255,255,255,.35);
      overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.15); }
    #kc-splash .kc-bar i { display: block; height: 100%; width: 38%; border-radius: 99px; background: #fff;
      animation: kc-load 1.3s ease-in-out infinite; }
    @keyframes kc-bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
    @keyframes kc-load { 0% { transform: translateX(-110%); } 100% { transform: translateX(290%); } }
  </style>
</head>
<body>
  <div id="kc-splash" aria-label="Unicorn Salon is loading">
    <img src="icons/Icon-512.png" alt="">
    <div class="kc-bar"><i></i></div>
  </div>
  <!-- flutter_soloud (ses motoru) web modülü. -->
  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('kc-splash');
      if (s) { s.classList.add('kc-gone'); setTimeout(function () { s.remove(); }, 600); }
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
    }
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
